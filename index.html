<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADA WAN - Control Global</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root { 
            --bg: #1e222d; --card: #2b303f; --text: #ffffff; 
            --dim: #b1b5be; --green: #66bb6a; --red: #ef5350; 
        }
        
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; display: flex; 
            flex-direction: column; align-items: center; padding: 20px; 
            margin: 0; min-height: 100vh; 
        }

        /* Pantalla de Login */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: var(--card); padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 300px;
        }
        .login-input {
            width: 90%; padding: 12px; margin: 15px 0; border-radius: 8px;
            border: 1px solid #3d445a; background: #1e222d; color: white; text-align: center;
        }

        /* Estructura Principal */
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; width: 100%; max-width: 500px; justify-content: center; }
        .ojo-buey { width: 15px; height: 15px; background: #444; border-radius: 50%; transition: 0.3s; }
        .online { background: var(--green); box-shadow: 0 0 12px var(--green); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 500px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .val { font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
        
        /* Botones Estilo Local */
        .btn { width: 85%; padding: 12px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; background: #3d445a; color: white; transition: 0.3s; text-transform: uppercase; }
        .active-led { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .active-alarm { background: var(--red); box-shadow: 0 0 10px var(--red); }
        
        .label { font-size: 0.9rem; color: var(--dim); margin-bottom: 5px; font-weight: bold; }
        .count-tag { font-size: 0.75rem; color: var(--dim); margin-top: 8px; }

        #main-content { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; }
        @media (max-width: 450px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h3>Acceso WAN</h3>
            <input type="password" id="passInput" class="login-input" placeholder="Contraseña">
            <button class="btn active-led" onclick="checkPass()">ENTRAR</button>
        </div>
    </div>

    <div id="main-content">
        <div class="header">
            <div id="status-led" class="ojo-buey"></div>
            <h2 style="margin:0;">SCADA WAN CONTROL</h2>
        </div>

        <div class="grid">
            <div class="card">
                <div class="label">POTENCIÓMETRO</div>
                <div class="val"><span id="pot">--</span>%</div>
            </div>

            <div class="card">
                <div class="label">LED MANUAL</div>
                <button id="btn-led" class="btn" onclick="toggleLED()">APAGADO</button>
            </div>

            <div class="card">
                <div class="label">ALARMA</div>
                <div id="alm-box" class="btn">OK</div>
                <div class="count-tag">Activaciones: <span id="counter">0</span></div>
            </div>

            <div class="card">
                <div class="label">SWITCH FÍSICO</div>
                <div id="sw-status" style="font-size: 1.1rem; margin-top:10px; font-weight:bold;">--</div>
            </div>
        </div>
    </div>

    <script>
        let client;
        let ledState = false; // Estado local de la variable en la web

        function checkPass() {
            if (document.getElementById('passInput').value === "Nano01") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';
                initMQTT();
            }
        }

        function initMQTT() {
            const broker = 'wss://broker.hivemq.com:8884/mqtt';
            client = mqtt.connect(broker);

            client.on('connect', () => {
                document.getElementById('status-led').classList.add('online');
                client.subscribe("esp32/telemetria/#");
                client.subscribe("esp32/alarmas/#");
            });

            client.on('message', (topic, message) => {
                const msg = message.toString();
                if (topic === "esp32/telemetria/pot") document.getElementById('pot').innerText = msg;
                if (topic === "esp32/alarmas/conteo") document.getElementById('counter').innerText = msg;
                if (topic === "esp32/telemetria/switch") {
                    document.getElementById('sw-status').innerText = (msg === "1") ? "CERRADO" : "ABIERTO";
                }
                if (topic === "esp32/alarmas/estado") {
                    const alm = document.getElementById('alm-box');
                    alm.innerText = (msg === "1") ? "ALERTA" : "NORMAL";
                    (msg === "1") ? alm.classList.add('active-alarm') : alm.classList.remove('active-alarm');
                }
            });
        }

        // Función corregida para funcionar sin feedback del ESP32
        function toggleLED() {
            if (client && client.connected) {
                ledState = !ledState; // Cambiamos el estado localmente
                const btn = document.getElementById('btn-led');
                
                if (ledState) {
                    client.publish("esp32/control/led", "1");
                    btn.innerText = "ENCENDIDO";
                    btn.classList.add('active-led');
                } else {
                    client.publish("esp32/control/led", "0");
                    btn.innerText = "APAGADO";
                    btn.classList.remove('active-led');
                }
            }
        }
    </script>
</body>
</html>
