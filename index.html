<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SCADA NANO - Panel Privado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1c24; color: white; text-align: center; }
        .container { display: flex; justify-content: center; gap: 20px; padding: 20px; }
        .card { background: #252936; padding: 20px; border-radius: 15px; width: 200px; border-top: 5px solid #4CAF50; }
        .val { font-size: 3em; font-weight: bold; color: #4CAF50; }
        .alarm-on { border-top-color: #ff4444 !important; }
        .btn { padding: 15px 25px; font-size: 1.2em; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>SCADA NANO - DASHBOARD WAN</h1>
    <p id="status">Conectando al Broker...</p>

    <div class="container">
        <div class="card" id="card-pot">
            <h3>Nivel Tanque</h3>
            <div class="val" id="pot-val">0%</div>
        </div>
        <div class="card">
            <h3>Alarmas</h3>
            <div class="val" id="alarm-count">0</div>
        </div>
    </div>

    <button class="btn" onclick="toggleLED()">CONMUTAR LED MANUAL</button>

    <script>
        // CONFIGURACIÓN IDÉNTICA AL ESP32 (Usando WebSockets para el navegador)
        const broker = "wss://430b579b966d4e73a269ce0c803564a7.s1.eu.hivemq.cloud:8884/mqtt";
        const options = {
            clientId: 'Web_Dashboard_' + Math.random().toString(16).substr(2, 8),
            username: 'Telemetria-Nano',
            password: 'Telemetria01',
        };

        const client = mqtt.connect(broker, options);

        client.on('connect', () => {
            document.getElementById('status').innerText = "✅ Conectado a HiveMQ Cloud";
            client.subscribe("esp32/telemetria/pot");
            client.subscribe("esp32/alarmas/estado");
            client.subscribe("esp32/alarmas/conteo");
        });

        client.on('message', (topic, message) => {
            const msg = message.toString();
            if(topic === "esp32/telemetria/pot") {
                document.getElementById('pot-val').innerText = msg + "%";
            }
            if(topic === "esp32/alarmas/estado") {
                document.getElementById('card-pot').classList.toggle('alarm-on', msg === "1");
            }
            if(topic === "esp32/alarmas/conteo") {
                document.getElementById('alarm-count').innerText = msg;
            }
        });

        let ledState = 0;
        function toggleLED() {
            ledState = ledState === 0 ? 1 : 0;
            client.publish("esp32/control/led", ledState.toString());
        }
    </script>
</body>
</html>
    </script>
</body>
</html>
