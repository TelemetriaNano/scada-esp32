<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32 SCADA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>ESP32 SCADA</h1>

  <div class="card" id="potCard">
    Potenciómetro: <b><span id="pot">--</span>%</b>
  </div>
  <div class="card">
    Switch: <span id="sw" class="badge">--</span>
  </div>
  <div class="card">
    LED: <span id="led" class="badge">--</span>
  </div>
  <button id="toggleBtn">Toggle LED</button>

  <script src="script.js"></script>
</body>
</html>
