<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Ventas - Barritas</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 6px;
      margin: 0 auto;
      max-width: 500px;
      background: #121824;
      color: #f1f5f9;
      font-size: 18px;
      line-height: 1.4;
      overflow-x: hidden;
    }
    .card {
      background: #1e293b;
      padding: 14px 10px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      margin-bottom: 12px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #38bdf8;
      text-align: center;
      font-size: 1.3em;
    }
    fieldset {
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 10px 8px;
      margin-bottom: 14px;
      background: #0f172a;
    }
    legend {
      font-weight: bold;
      color: #38bdf8;
      padding: 0 6px;
      font-size: 0.9em;
    }
    label {
      font-weight: 600;
      display: block;
      margin-top: 8px;
      font-size: 0.85em;
      color: #cbd5e1;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 2px solid #475569;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95em;
      background: #1e293b;
      color: #ffffff;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #38bdf8;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    .row > div {
      flex: 1;
      min-width: 0;
    }
    
    .pago-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .pago-option {
      display: flex;
      align-items: center;
      background: #1e293b;
      border: 2px solid #475569;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
      user-select: none;
      transition: all 0.2s ease;
    }
    .pago-option:focus-within {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
    }
    .pago-option input[type="radio"] {
      opacity: 0;
      width: 0;
      height: 0;
      margin: 0;
      position: absolute;
    }
    .pago-option .check-icon {
      width: 22px;
      height: 22px;
      border: 2px solid #64748b;
      border-radius: 6px;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: transparent;
      font-weight: 900;
      font-size: 14px;
    }
    .pago-option input[type="radio"]:checked + .check-icon {
      background: #22c55e;
      border-color: #22c55e;
      color: #ffffff;
    }
    .pago-option:has(input[type="radio"]:checked) {
      border-color: #22c55e;
      background: #064e3b;
      color: #ffffff;
    }

    button.btn-action {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-save { background: #16a34a; color: white; }
    .btn-sync { background: #0284c7; color: white; }
    .btn-menu { background: #475569; color: #ffffff; border: 1px solid #64748b; }
    .btn-fetch { background: #9333ea; color: white; font-size: 0.85em; padding: 10px; }
    .btn-nav { background: #334155; color: #38bdf8; border: 1px solid #475569; }
    .btn-pending-pay { background: #ca8a04; color: #ffffff; border: 1px solid #eab308; }
    .btn-stock { background: #d97706; color: white; }
    .btn-stock-info { background: #0d9488; color: white; }
    .btn-efectivo { background: #15803d; color: white; margin-top: 6px; }
    .btn-transf { background: #0369a1; color: white; margin-top: 6px; }
    
    .status { margin-top: 10px; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 0.85em; }
    .pending-badge {
      background: #eab308;
      color: #0f172a;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.8em;
      font-weight: 800;
      margin-left: 6px;
    }

    /* --- PANELS Y SUBMENÚ (DRAWER) --- */
    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);
      z-index: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: #1e293b;
      z-index: 950;
      box-shadow: -5px 0 25px rgba(0,0,0,0.8);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .drawer-panel.active {
      right: 0;
    }

    .drawer-header {
      padding: 14px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-header h3 { margin: 0; color: #38bdf8; font-size: 1.1em; }
    .btn-close-drawer {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5em;
      cursor: pointer;
    }

    .drawer-content {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }

    .menu-section-title {
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .venta-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-pendiente-pago {
      background: #fef08a !important;
      border: 2px solid #eab308 !important;
      color: #0f172a !important;
    }
    .card-pendiente-pago .cliente-nombre { color: #0f172a !important; }
    .card-pendiente-pago .fecha-sub { color: #713f12 !important; }
    .card-pendiente-pago .monto-txt { color: #854d0e !important; }

    .badge {
      font-size: 0.75em;
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: bold;
      display: inline-block;
      margin-top: 4px;
    }
    .badge-pending { background: #854d0e; color: #fef08a; }
    .badge-synced { background: #166534; color: #bbf7d0; }
    .badge-cta-corriente { background: #ca8a04; color: #ffffff; }

    /* Modales */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      color: #f1f5f9;
      box-shadow: 0 20px 30px rgba(0,0,0,0.8);
    }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9em; border-bottom: 1px dashed #334155; padding-bottom: 4px; }

    /* TARJETAS DE STOCK GRANDE EN POPUP */
    .stock-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
      margin-bottom: 15px;
    }
    .stock-card-big {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 12px 6px;
      text-align: center;
    }
    .stock-card-big .num {
      font-size: 1.8em;
      font-weight: 900;
      color: #38bdf8;
      margin-top: 4px;
    }
    .stock-card-big .label {
      font-size: 0.75em;
      color: #94a3b8;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Nueva Venta</h2>
  <form id="ventaForm">
    <fieldset>
      <legend>Datos Principales</legend>
      <div class="row">
        <div>
          <label>Vendedor</label>
          <input type="text" id="vendedor" placeholder="Ej. Juan" required>
        </div>
        <div>
          <label>Fecha</label>
          <input type="date" id="fechaVenta" required>
        </div>
      </div>

      <label>Cliente</label>
      <input type="text" id="cliente" required placeholder="Ej. María Pérez" list="listaClientas" autocomplete="off">
      <datalist id="listaClientas"></datalist>
    </fieldset>

    <fieldset>
      <legend>Productos (Cajas)</legend>
      <div class="row">
        <div>
          <label>Cajas x 25</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="cajas25" placeholder="0" min="0">
        </div>
        <div>
          <label>Cajas x 12</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="cajas12" placeholder="0" min="0">
        </div>
        <div>
          <label>Granola x 9</label>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="cajasGranola" placeholder="0" min="0">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Importe y Forma de Pago</legend>
      <label>Importe Total ($)</label>
      <input type="text" inputmode="numeric" id="importeTotalFormat" placeholder="0" required>

      <label>Forma de Pago</label>
      <div class="pago-selector">
        <label class="pago-option" tabindex="0">
          <input type="radio" name="medioPago" value="efectivo" required>
          <span class="check-icon">✓</span>
          Efectivo
        </label>
        <label class="pago-option" tabindex="0">
          <input type="radio" name="medioPago" value="transferencia">
          <span class="check-icon">✓</span>
          Transferencia
        </label>
        <label class="pago-option" tabindex="0">
          <input type="radio" name="medioPago" value="ctaCorriente">
          <span class="check-icon">✓</span>
          Cuenta Corriente
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Notas</legend>
      <label>Novedades</label>
      <textarea id="novedades" rows="2" placeholder="Detalles u observaciones..."></textarea>
    </fieldset>

    <button type="submit" class="btn-action btn-save">🟢 Guardar Venta (Offline)</button>
  </form>

  <!-- ÚNICOS BOTONES VISIBLES EN PANTALLA INICIAL -->
  <button id="syncBtn" class="btn-action btn-sync" onclick="sincronizarConDrive()">
    ☁️ Sincronizar con Google Drive <span id="pendingBadge" class="pending-badge">0</span>
  </button>
  
  <button type="button" class="btn-action btn-menu" onclick="abrirMenuPrincipal()">
    🍔 Menú de Opciones
  </button>
  
  <div id="statusMsg"></div>
</div>

<!-- SUB-MENÚ PRINCIPAL (DRAWER) -->
<div id="drawerOverlay" class="drawer-overlay" onclick="cerrarSubmenus()"></div>

<div id="menuPrincipalPanel" class="drawer-panel">
  <div class="drawer-header">
    <h3>🍔 Menú de Opciones</h3>
    <button class="btn-close-drawer" onclick="cerrarSubmenus()">&times;</button>
  </div>
  <div class="drawer-content">
    
    <div class="menu-section-title">📦 Gestión de Stock</div>
    <button type="button" class="btn-action btn-stock" onclick="abrirModalCargaStock()">📥 Cargar / Recibir Stock</button>
    <button type="button" class="btn-action btn-stock-info" onclick="consultarStockDisponibleModal()">📊 Ver Mi Stock Actual</button>

    <div class="menu-section-title">📜 Ventas y Cobros</div>
    <button type="button" class="btn-action btn-pending-pay" onclick="abrirDrawerPendientes()">⚠️ Ver Pendientes de Pago</button>
    <button type="button" class="btn-action btn-nav" onclick="abrirDrawerHistorial()">📋 Ver Mis Últimas Ventas</button>

    <div class="menu-section-title">☁️ Sincronización</div>
    <button type="button" class="btn-action btn-fetch" onclick="descargarClientasDesdeNube()">📥 Descargar Clientes de la Nube</button>

  </div>
</div>

<!-- PANEL HISTORIAL GENERAL -->
<div id="drawerHistorialPanel" class="drawer-panel">
  <div class="drawer-header">
    <h3>Mis Últimas Ventas</h3>
    <button class="btn-close-drawer" onclick="cerrarSubmenus()">&times;</button>
  </div>
  <div class="drawer-content">
    <button type="button" class="btn-action btn-fetch" style="margin-bottom: 10px;" onclick="cargarHistorialVendedor()">🔄 Actualizar Historial</button>
    <div id="historialStatus"></div>
    <div id="listaVentasContainer" style="margin-top: 8px;"></div>
  </div>
</div>

<!-- PANEL DEUDAS PENDIENTES -->
<div id="drawerPendientesPanel" class="drawer-panel">
  <div class="drawer-header" style="background: #451a03; border-bottom-color: #78350f;">
    <h3 style="color: #fef08a;">⚠️ Pendientes de Pago</h3>
    <button class="btn-close-drawer" onclick="cerrarSubmenus()">&times;</button>
  </div>
  <div class="drawer-content">
    <button type="button" class="btn-action btn-pending-pay" style="margin-bottom: 10px;" onclick="cargarPendientesPago()">🔄 Actualizar Deudas</button>
    <div id="pendientesStatus"></div>
    <div id="listaPendientesContainer" style="margin-top: 8px;"></div>
  </div>
</div>

<!-- MODAL 1: CARGA DE STOCK -->
<div id="modalStock" class="modal-overlay">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:8px; margin-bottom:12px;">
      <h3 style="margin:0; color:#38bdf8; font-size:1.1em;">Cargar Stock Recibido</h3>
      <button class="btn-close-drawer" onclick="cerrarModalStock()">&times;</button>
    </div>
    
    <form id="formCargaStock" onsubmit="guardarCargaStock(event)">
      <div class="row">
        <div>
          <label>Cajas x 25</label>
          <input type="number" inputmode="numeric" id="stockCajas25" min="0" value="0" required>
        </div>
        <div>
          <label>Cajas x 12</label>
          <input type="number" inputmode="numeric" id="stockCajas12" min="0" value="0" required>
        </div>
        <div>
          <label>Granola x 9</label>
          <input type="number" inputmode="numeric" id="stockGranola" min="0" value="0" required>
        </div>
      </div>

      <label style="margin-top:12px;">Observaciones / Origen</label>
      <input type="text" id="stockObservaciones" placeholder="Ej: Retirado de Depósito">

      <div id="modalStockStatus" style="margin-top:10px;"></div>

      <div style="display:flex; gap:8px; margin-top:16px;">
        <button type="button" class="btn-action btn-nav" style="flex:1;" onclick="cerrarModalStock()">Cancelar</button>
        <button type="submit" class="btn-action btn-save" style="flex:1;" id="btnGuardarStock">Confirmar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL 2: VER STOCK ACTUAL EN GRANDE (NUEVO) -->
<div id="modalVerStock" class="modal-overlay">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:8px; margin-bottom:12px;">
      <h3 id="tituloStockVendedor" style="margin:0; color:#38bdf8; font-size:1.1em;">📊 Stock Disponible</h3>
      <button class="btn-close-drawer" onclick="cerrarModalVerStock()">&times;</button>
    </div>
    
    <div id="verStockBody">
      <div style="text-align:center; padding:15px; color:#94a3b8;">Consultando datos...</div>
    </div>

    <button type="button" class="btn-action btn-nav" onclick="cerrarModalVerStock()" style="margin-top:12px;">Cerrar</button>
  </div>
</div>

<!-- MODAL 3: DETALLE DE VENTA -->
<div id="modalDetalle" class="modal-overlay">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:8px; margin-bottom:12px;">
      <h3 id="modalTitulo" style="margin:0; color:#38bdf8; font-size:1.1em;">Detalle de Venta</h3>
      <button class="btn-close-drawer" onclick="cerrarModal()">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLiOasSNGMlsFdJGimb9f3RSQKa_3PK0OAF-S82bwJI5EF7rRE7wD5ZW189dZyUBbwNA/exec";

  function mostrarMensaje(texto, colorFondo, targetId = 'statusMsg') {
    const el = document.getElementById(targetId);
    if (!el) return;
    el.className = 'status';
    el.style.backgroundColor = colorFondo;
    el.style.color = '#ffffff';
    el.innerText = texto;
  }

  document.querySelectorAll('.pago-option').forEach(option => {
    option.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const radio = this.querySelector('input[type="radio"]');
        if (radio) {
          radio.checked = true;
          radio.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }
    });
  });

  const vendedorGuardado = localStorage.getItem('ultimo_vendedor') || '';
  if (vendedorGuardado) {
    document.getElementById('vendedor').value = vendedorGuardado;
  }

  document.getElementById('fechaVenta').valueAsDate = new Date();

  const inputImporte = document.getElementById('importeTotalFormat');
  inputImporte.addEventListener('input', function() {
    let raw = this.value.replace(/\D/g, '');
    if (!raw) {
      this.value = '';
      return;
    }
    this.value = new Intl.NumberFormat('es-AR').format(raw).replace(/\./g, ' ');
  });

  // --- NAVEGACIÓN DE MENÚS Y SUBMENÚS ---
  function abrirMenuPrincipal() {
    document.getElementById('drawerOverlay').classList.add('active');
    document.getElementById('menuPrincipalPanel').classList.add('active');
  }

  function cerrarSubmenus() {
    document.getElementById('drawerOverlay').classList.remove('active');
    document.getElementById('menuPrincipalPanel').classList.remove('active');
    document.getElementById('drawerHistorialPanel').classList.remove('active');
    document.getElementById('drawerPendientesPanel').classList.remove('active');
  }

  function abrirDrawerHistorial() {
    document.getElementById('menuPrincipalPanel').classList.remove('active');
    document.getElementById('drawerHistorialPanel').classList.add('active');
    cargarHistorialVendedor();
  }

  function abrirDrawerPendientes() {
    document.getElementById('menuPrincipalPanel').classList.remove('active');
    document.getElementById('drawerPendientesPanel').classList.add('active');
    cargarPendientesPago();
  }

  /* --- POP-UP CARGA DE STOCK --- */
  function abrirModalCargaStock() {
    cerrarSubmenus();
    const v = document.getElementById('vendedor').value.trim();
    if (!v) {
      mostrarMensaje("Ingresa primero el Vendedor en el formulario", "#ef4444");
      return;
    }
    document.getElementById('formCargaStock').reset();
    document.getElementById('modalStockStatus').innerHTML = "";
    document.getElementById('modalStock').classList.add('active');
  }

  function cerrarModalStock() {
    document.getElementById('modalStock').classList.remove('active');
  }

  function guardarCargaStock(event) {
    event.preventDefault();
    const vendedorActivo = document.getElementById('vendedor').value.trim();
    
    if (!vendedorActivo) {
      mostrarMensaje("Escribe el nombre del Vendedor", "#ef4444", "modalStockStatus");
      return;
    }

    const btn = document.getElementById("btnGuardarStock");
    btn.disabled = true;
    btn.innerText = "Guardando...";

    const c25 = document.getElementById("stockCajas25").value || 0;
    const c12 = document.getElementById("stockCajas12").value || 0;
    const cGranola = document.getElementById("stockGranola").value || 0;
    const obs = document.getElementById("stockObservaciones").value || "";
    const hoyStr = new Date().toISOString().split('T')[0];

    const params = {
      accion: 'registrarCargaStock',
      vendedor: vendedorActivo,
      cajas25: c25,
      cajas12: c12,
      cajasGranola: cGranola,
      observaciones: obs,
      fecha: hoyStr
    };

    ejecutarJSONP(params, function(res) {
      btn.disabled = false;
      btn.innerText = "Confirmar";

      if (res && res.status === "OK") {
        mostrarMensaje(`¡Stock cargado con éxito! ID: ${res.idCarga} 🎉`, "#16a34a", "modalStockStatus");
        setTimeout(() => {
          cerrarModalStock();
        }, 1500);
      } else {
        mostrarMensaje("Error al guardar stock: " + (res.message || "Error de red"), "#ef4444", "modalStockStatus");
      }
    });
  }

  /* --- POP-UP VER STOCK ACTUAL (NUEVO VISUAL) --- */
  function consultarStockDisponibleModal() {
    cerrarSubmenus();
    const v = document.getElementById('vendedor').value.trim();
    if (!v) {
      mostrarMensaje("Ingresa el Vendedor en el formulario principal", "#ef4444");
      return;
    }

    document.getElementById('tituloStockVendedor').innerText = `📦 Stock: ${v}`;
    document.getElementById('verStockBody').innerHTML = `<div style="text-align:center; padding:20px; color:#eab308;">Consultando Excel en la nube...</div>`;
    document.getElementById('modalVerStock').classList.add('active');

    ejecutarJSONP({ accion: 'obtenerStockVendedor', vendedor: v }, function(res) {
      if (res && res.status === "OK" && res.stock) {
        const s = res.stock;
        document.getElementById('verStockBody').innerHTML = `
          <div class="stock-grid">
            <div class="stock-card-big">
              <div class="label">Cajas x 25</div>
              <div class="num">${s.cajas25}</div>
            </div>
            <div class="stock-card-big">
              <div class="label">Cajas x 12</div>
              <div class="num">${s.cajas12}</div>
            </div>
            <div class="stock-card-big">
              <div class="label">Granola x 9</div>
              <div class="num">${s.cajasGranola}</div>
            </div>
          </div>
        `;
      } else {
        document.getElementById('verStockBody').innerHTML = `<div style="text-align:center; padding:20px; color:#ef4444;">No se pudo sincronizar el stock actual.</div>`;
      }
    });
  }

  function cerrarModalVerStock() {
    document.getElementById('modalVerStock').classList.remove('active');
  }

  function actualizarListaClientasUI() {
    let clientas = JSON.parse(localStorage.getItem('memoria_clientas')) || [];
    const datalist = document.getElementById('listaClientas');
    datalist.innerHTML = '';
    clientas.forEach(nombre => {
      let option = document.createElement('option');
      option.value = nombre;
      datalist.appendChild(option);
    });
  }

  function guardarClientaEnMemoria(nombre) {
    if (!nombre) return;
    let clientas = JSON.parse(localStorage.getItem('memoria_clientas')) || [];
    if (!clientas.includes(nombre.trim())) {
      clientas.push(nombre.trim());
      localStorage.setItem('memoria_clientas', JSON.stringify(clientas));
      actualizarListaClientasUI();
    }
  }

  function descargarClientasDesdeNube() {
    cerrarSubmenus();
    mostrarMensaje("Buscando clientes...", "#eab308");
    ejecutarJSONP({ accion: 'obtenerClientas' }, function(respuesta) {
      if (respuesta && respuesta.status === "OK" && Array.isArray(respuesta.clientas)) {
        let clientasNube = respuesta.clientas;
        let clientasLocales = JSON.parse(localStorage.getItem('memoria_clientas')) || [];
        let unificadas = Array.from(new Set([...clientasLocales, ...clientasNube]));
        localStorage.setItem('memoria_clientas', JSON.stringify(unificadas));
        actualizarListaClientasUI();
        mostrarMensaje(`¡Se descargaron ${clientasNube.length} clientes! ☁️`, "#16a34a");
      } else {
        mostrarMensaje("Error al descargar clientes ⚠️", "#ef4444");
      }
    });
  }

  document.getElementById('ventaForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const radioSeleccionado = document.querySelector('input[name="medioPago"]:checked');
    if (!radioSeleccionado) {
      mostrarMensaje("Por favor, selecciona una Forma de Pago", "#ef4444");
      return;
    }

    const nombreVendedor = document.getElementById('vendedor').value;
    const nombreCliente = document.getElementById('cliente').value;
    
    localStorage.setItem('ultimo_vendedor', nombreVendedor);
    guardarClientaEnMemoria(nombreCliente);

    const importeNumerico = inputImporte.value.replace(/\s+/g, '') || '0';

    const nuevaVenta = {
      id: Date.now(),
      vendedor: nombreVendedor,
      cliente: nombreCliente,
      fechaVenta: document.getElementById('fechaVenta').value,
      cajas25: document.getElementById('cajas25').value || 0,
      cajas12: document.getElementById('cajas12').value || 0,
      cajasGranola: document.getElementById('cajasGranola').value || 0,
      importeTotal: importeNumerico,
      medioPago: radioSeleccionado.value,
      novedades: document.getElementById('novedades').value || "",
      sincronizado: false
    };

    let ventas = JSON.parse(localStorage.getItem('ventas_barritas')) || [];
    ventas.push(nuevaVenta);
    localStorage.setItem('ventas_barritas', JSON.stringify(ventas));

    actualizarContador();
    
    this.reset();
    document.getElementById('vendedor').value = nombreVendedor;
    document.getElementById('fechaVenta').valueAsDate = new Date();
    
    mostrarMensaje("Venta guardada localmente ✔️", "#16a34a");
  });

  function actualizarContador() {
    let ventas = JSON.parse(localStorage.getItem('ventas_barritas')) || [];
    document.getElementById('pendingBadge').innerText = ventas.length;
  }

  function ejecutarJSONP(parametros, callbackFinal) {
    const callbackName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    parametros.callback = callbackName;

    const query = new URLSearchParams(parametros).toString();
    const script = document.createElement('script');
    script.id = callbackName;

    let timeout = setTimeout(() => {
      cleanup();
      callbackFinal({ status: "ERROR", message: "Timeout de conexión" });
    }, 15000);

    function cleanup() {
      if (timeout) clearTimeout(timeout);
      delete window[callbackName];
      const el = document.getElementById(callbackName);
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    window[callbackName] = function(res) {
      cleanup();
      callbackFinal(res);
    };

    script.onerror = function() {
      cleanup();
      callbackFinal({ status: "ERROR", message: "Error de red" });
    };

    script.src = `${GOOGLE_SCRIPT_URL}?${query}`;
    document.body.appendChild(script);
  }

  function sincronizarConDrive() {
    let ventas = JSON.parse(localStorage.getItem('ventas_barritas')) || [];
    if (ventas.length === 0) {
      mostrarMensaje("No hay ventas pendientes por subir", "#64748b");
      return;
    }

    mostrarMensaje("Subiendo a Google Drive...", "#eab308");

    const params = {
      accion: 'registrarVentasLote',
      data: JSON.stringify(ventas)
    };

    ejecutarJSONP(params, function(respuesta) {
      if (respuesta && respuesta.status === "OK" && Array.isArray(respuesta.idsExitosos)) {
        let exitosos = respuesta.idsExitosos;
        let pendientesReales = ventas.filter(v => !exitosos.includes(v.id));
        
        localStorage.setItem('ventas_barritas', JSON.stringify(pendientesReales));
        actualizarContador();

        if (pendientesReales.length === 0) {
          mostrarMensaje("¡Todas las ventas subieron con éxito! 🎉", "#16a34a");
        } else {
          mostrarMensaje(`Se subieron ${exitosos.length}. Quedan ${pendientesReales.length} pendientes.`, "#eab308");
        }
      } else {
        mostrarMensaje("Error en la sincronización ❌", "#ef4444");
      }
    });
  }

  function cargarHistorialVendedor() {
    const vendedorActual = document.getElementById('vendedor').value.trim();
    const container = document.getElementById('listaVentasContainer');
    
    if (!vendedorActual) {
      mostrarMensaje("Ingresa el Vendedor en el formulario principal", "#ef4444", "historialStatus");
      container.innerHTML = "";
      return;
    }

    mostrarMensaje(`Cargando ventas de ${vendedorActual}...`, "#eab308", "historialStatus");

    let ventasLocales = JSON.parse(localStorage.getItem('ventas_barritas')) || [];
    let pendientesVendedor = ventasLocales.filter(v => v.vendedor.toLowerCase() === vendedorActual.toLowerCase());

    ejecutarJSONP({ accion: 'obtenerUltimasVentas', vendedor: vendedorActual }, function(res) {
      let ventasNube = [];
      if (res && res.status === "OK" && Array.isArray(res.ventas)) {
        ventasNube = res.ventas;
        mostrarMensaje(`Mostrando ${pendientesVendedor.length + ventasNube.length} ventas`, "#16a34a", "historialStatus");
      } else {
        mostrarMensaje("Mostrando solo ventas pendientes (Offline)", "#eab308", "historialStatus");
      }

      const todas = [...pendientesVendedor, ...ventasNube];
      renderizarListaHistorial(todas, container);
    });
  }

  function cargarPendientesPago() {
    const vendedorActual = document.getElementById('vendedor').value.trim();
    const container = document.getElementById('listaPendientesContainer');
    
    if (!vendedorActual) {
      mostrarMensaje("Ingresa el Vendedor en el formulario principal", "#ef4444", "pendientesStatus");
      container.innerHTML = "";
      return;
    }

    mostrarMensaje(`Buscando deudas de ${vendedorActual}...`, "#eab308", "pendientesStatus");

    let ventasLocales = JSON.parse(localStorage.getItem('ventas_barritas')) || [];
    let pendientesLocales = ventasLocales.filter(v => 
      v.vendedor.toLowerCase() === vendedorActual.toLowerCase() && v.medioPago === 'ctaCorriente'
    );

    ejecutarJSONP({ accion: 'obtenerPendientesPago', vendedor: vendedorActual }, function(res) {
      let pendientesNube = [];
      if (res && res.status === "OK" && Array.isArray(res.ventas)) {
        pendientesNube = res.ventas;
        mostrarMensaje(`Se encontraron ${pendientesLocales.length + pendientesNube.length} deudas pendientes`, "#ca8a04", "pendientesStatus");
      } else {
        mostrarMensaje("Mostrando deudas locales pendientes de subir", "#eab308", "pendientesStatus");
      }

      const todasPendientes = [...pendientesLocales, ...pendientesNube];
      renderizarListaHistorial(todasPendientes, container);
    });
  }

  function renderizarListaHistorial(lista, containerEl) {
    containerEl.innerHTML = "";

    if (lista.length === 0) {
      containerEl.innerHTML = "<div style='text-align:center; color:#94a3b8; padding:20px;'>No hay registros.</div>";
      return;
    }

    lista.forEach(v => {
      const card = document.createElement('div');
      const esPendientePago = v.sincronizado && (v.medioPago === 'ctaCorriente' || String(v.pagado).toLowerCase() === 'no');

      card.className = 'venta-card' + (esPendientePago ? ' card-pendiente-pago' : '');
      
      let badgeHtml = "";
      if (!v.sincronizado) {
        badgeHtml = `<span class="badge badge-pending">⌛ Pendiente Subir</span>`;
      } else if (esPendientePago) {
        badgeHtml = `<span class="badge badge-cta-corriente">⚠️ Deuda Pendiente</span>`;
      } else {
        badgeHtml = `<span class="badge badge-synced">☁️ ${v.pagado || 'Pagado'}</span>`;
      }

      const totalFormateado = new Intl.NumberFormat('es-AR').format(v.importeTotal);

      card.innerHTML = `
        <div>
          <div class="cliente-nombre" style="font-weight: bold; color: #f8fafc;">${v.cliente}</div>
          <div class="fecha-sub" style="font-size: 0.8em; color: #94a3b8;">📅 ${v.fechaVenta}</div>
          ${badgeHtml}
        </div>
        <div class="monto-txt" style="text-align: right; font-weight: bold; color: #38bdf8; font-size: 1.05em;">
          $${totalFormateado}
        </div>
      `;

      card.onclick = () => abrirModalDetalle(v);
      containerEl.appendChild(card);
    });
  }

  function abrirModalDetalle(venta) {
    const totalFormateado = new Intl.NumberFormat('es-AR').format(venta.importeTotal);
    const esPendientePago = venta.sincronizado && (venta.medioPago === 'ctaCorriente' || String(venta.pagado).toLowerCase() === 'no');
    
    document.getElementById('modalTitulo').innerText = `Cliente: ${venta.cliente}`;
    
    let htmlContent = `
      <div class="detail-row"><span>ID / Estado:</span> <strong>${venta.sincronizado ? venta.id : 'Pendiente Sincronización'}</strong></div>
      <div class="detail-row"><span>Fecha:</span> <strong>${venta.fechaVenta}</strong></div>
      <div class="detail-row"><span>Vendedor:</span> <strong>${venta.vendedor}</strong></div>
      <div class="detail-row"><span>Cajas x 25:</span> <strong>${venta.cajas25}</strong></div>
      <div class="detail-row"><span>Cajas x 12:</span> <strong>${venta.cajas12}</strong></div>
      <div class="detail-row"><span>Granola x 9:</span> <strong>${venta.cajasGranola}</strong></div>
      <div class="detail-row"><span>Forma Pago Orig.:</span> <strong>${venta.medioPago}</strong></div>
      <div class="detail-row"><span>Estado Cobro:</span> <strong>${venta.pagado || 'No'}</strong></div>
      <div class="detail-row"><span>Importe Total:</span> <strong style="color:#38bdf8; font-size:1.1em;">$${totalFormateado}</strong></div>
      
      <div style="margin-top:10px;">
        <label style="font-size:0.85em; color:#94a3b8; margin-bottom:4px; display:block;">Novedades / Observaciones:</label>
        <textarea id="modalNovedades" rows="2" style="background:#0f172a; font-size:0.9em;">${venta.novedades || ''}</textarea>
      </div>
      <div id="modalStatusMsg" style="margin-top:6px;"></div>
    `;

    if (esPendientePago) {
      htmlContent += `
        <div style="margin-top:14px; border-top:1px solid #334155; padding-top:10px;">
          <label style="color:#fef08a; font-weight:bold; margin-bottom:6px; text-align:center; display:block;">Registrar Cobro Pendiente:</label>
          <button class="btn-action btn-efectivo" onclick="marcarComoPagado('${venta.id}', 'efectivo')">💵 Pagado en Efectivo</button>
          <button class="btn-action btn-transf" onclick="marcarComoPagado('${venta.id}', 'transferencia')">🏦 Pagado por Transferencia</button>
        </div>
      `;
    }

    document.getElementById('modalBody').innerHTML = htmlContent;
    document.getElementById('modalDetalle').classList.add('active');
  }

  function marcarComoPagado(idVenta, metodoPago) {
    const novedadesActualizadas = document.getElementById('modalNovedades').value;
    const hoyStr = new Date().toISOString().split('T')[0];

    mostrarMensaje("Actualizando pago en la nube...", "#eab308", "modalStatusMsg");

    const params = {
      accion: 'actualizarPago',
      id: idVenta,
      nuevoMedioPago: metodoPago,
      novedades: novedadesActualizadas,
      fechaPago: hoyStr
    };

    ejecutarJSONP(params, function(res) {
      if (res && res.status === "OK") {
        mostrarMensaje("¡Pago registrado en Excel! 🎉", "#16a34a", "modalStatusMsg");
        setTimeout(() => {
          cerrarModal();
          if (document.getElementById('drawerPendientesPanel').classList.contains('active')) {
            cargarPendientesPago();
          } else {
            cargarHistorialVendedor();
          }
        }, 1200);
      } else {
        mostrarMensaje("Error al actualizar: " + (res.message || "Error de red"), "#ef4444", "modalStatusMsg");
      }
    });
  }

  function cerrarModal() {
    document.getElementById('modalDetalle').classList.remove('active');
  }

  actualizarListaClientasUI();
  actualizarContador();
</script>
