<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADA NANO - Control Total</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root { 
            --bg: #1e222d; --card: #2b303f; --text: #ffffff; 
            --dim: #b1b5be; --green: #66bb6a; --red: #ef5350; --accent: #42a5f5;
        }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }
        /* Login */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        /* Estructura */
        .top-bar {
            width: 100%; max-width: 500px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #3d445a;
        }
        #main-content { display: none; width: 100%; max-width: 450px; padding: 15px; }
        .page { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.4s; }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { 
            background: var(--card); border-radius: 15px; padding: 20px; 
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            width: 100%; margin-bottom: 15px; box-sizing: border-box;
        }
        .val { font-size: 2.8rem; font-weight: bold; margin: 5px 0; color: var(--accent); }
        .label { font-size: 0.7rem; color: var(--dim); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Botones */
        .btn { width: 100%; padding: 12px; border-radius: 30px; border: none; font-weight: bold; background: #3d445a; color: white; cursor: pointer; }
        .active-led { background: var(--green); color: #111; box-shadow: 0 0 15px var(--green); }
        .active-alarm { background: var(--red); box-shadow: 0 0 10px var(--red); }
        
        .nav-container { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 10px; }
        .nav-arrow { background: var(--card); color: var(--accent); border: 1px solid var(--accent); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .ojo-buey { width: 10px; height: 10px; background: #444; border-radius: 50%; display: inline-block; }
        .online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="card" style="width: 280px;">
            <h3>SCADA LOGIN</h3>
            <input type="password" id="passInput" style="width:90%; padding:10px; margin-bottom:15px; background:#1e222d; border:1px solid #3d445a; color:white; text-align:center; border-radius:8px;" placeholder="Contraseña">
            <button class="btn active-led" onclick="checkPass()">ENTRAR</button>
        </div>
    </div>

    <div id="header-brand" class="top-bar" style="display:none;">
        <div style="font-weight:bold;">TELEMETRÍA <span style="color:var(--accent)">NANO</span></div>
        <div id="status-led" class="ojo-buey"></div>
    </div>

    <div id="main-content">
        
        <div id="page1" class="page active">
            <div class="card">
                <div class="label">Potenciómetro ESP 1</div>
                <div class="val"><span id="pot">--</span>%</div>
            </div>

            <div class="card" style="border-left: 5px solid var(--accent);">
                <div class="label">Pulsador ESP 2</div>
                <div id="p2-status" style="margin: 10px 0; font-weight: bold;">ESPERANDO...</div>
                <hr style="border: 0; border-top: 1px solid #3d445a; margin: 10px 0;">
                <div class="label">Contador Flash</div>
                <div id="p2-count" style="font-size: 1.5rem; font-weight: bold; color: var(--accent);">0</div>
            </div>

            <div class="card">
                <div id="alm-box" class="btn" style="cursor:default;">ESTADO NORMAL</div>
            </div>

            <div class="nav-container">
                <div style="width:45px"></div>
                <span style="font-size:0.7rem; color:var(--dim);">PANEL DE CONTROL</span>
                <div class="nav-arrow" onclick="changePage(2)">→</div>
            </div>
        </div>

        <div id="page2" class="page">
            <div class="card">
                <div class="label">LED Remoto ESP 1</div>
                <button id="btn-led" class="btn" onclick="toggleLED()" style="margin: 20px 0; height: 80px; font-size: 1.2rem;">APAGADO</button>
                <div class="label" id="sw-status">Switch Físico ESP 1: --</div>
            </div>

            <div class="nav-container">
                <div class="nav-arrow" onclick="changePage(1)">←</div>
                <span style="font-size:0.7rem; color:var(--dim);">VOLVER</span>
                <div style="width:45px"></div>
            </div>
        </div>

    </div>

    <script>
        let client;
        let ledState = false;

        function checkPass() {
            if (document.getElementById('passInput').value === "Nano01") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('header-brand').style.display = 'flex';
                initMQTT();
            } else { alert("Error"); }
        }

        function changePage(n) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + n).classList.add('active');
        }

        function initMQTT() {
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

            client.on('connect', () => {
                document.getElementById('status-led').classList.add('online');
                // Suscribir a TODO
                client.subscribe("esp32/telemetria/#");
                client.subscribe("esp32/alarmas/#");
                client.subscribe("esp32/control/led");
                client.subscribe("esp32_2/telemetria/#");
            });

            client.on('message', (topic, message) => {
                const msg = message.toString();
                
                // ESP 1
                if (topic === "esp32/telemetria/pot") document.getElementById('pot').innerText = msg;
                if (topic === "esp32/alarmas/estado") {
                    const b = document.getElementById('alm-box');
                    b.innerText = msg === "1" ? "¡ALARMA ACTIVA!" : "ESTADO NORMAL";
                    msg === "1" ? b.classList.add('active-alarm') : b.classList.remove('active-alarm');
                }
                if (topic === "esp32/control/led") {
                    ledState = (msg === "1");
                    const btn = document.getElementById('btn-led');
                    btn.innerText = ledState ? "ENCENDIDO" : "APAGADO";
                    ledState ? btn.classList.add('active-led') : btn.classList.remove('active-led');
                }
                if (topic === "esp32/telemetria/switch") {
                    document.getElementById('sw-status').innerText = "Switch Físico ESP 1: " + (msg === "1" ? "CERRADO" : "ABIERTO");
                }

                // ESP 2
                if (topic === "esp32_2/telemetria/pulsador") {
                    const p2 = document.getElementById('p2-status');
                    p2.innerText = msg === "1" ? "PULSADO" : "LIBRE";
                    p2.style.color = msg === "1" ? "var(--green)" : "var(--dim)";
                }
                if (topic === "esp32_2/telemetria/conteo") {
                    document.getElementById('p2-count').innerText = msg;
                }
            });
        }

        function toggleLED() {
            if (client && client.connected) {
                client.publish("esp32/control/led", ledState ? "0" : "1", {retain: true});
            }
        }
    </script>
</body>
</html>
