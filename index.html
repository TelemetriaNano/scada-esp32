<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADA WAN - Proyecto #1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root { 
            --bg: #1e222d; --card: #2b303f; --text: #ffffff; 
            --dim: #b1b5be; --green: #66bb6a; --red: #ef5350; --accent: #42a5f5;
        }
        
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- HEADER CORPORATIVO --- */
        .top-bar {
            width: 100%; max-width: 500px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; border-bottom: 1px solid #3d445a; margin-bottom: 10px;
        }
        .brand { line-height: 1.1; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }
        .brand span { color: var(--accent); }
        .user-info { font-size: 0.75rem; color: var(--dim); text-align: right; }

        /* Login Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }

        /* Contenedor Principal */
        #main-content { 
            display: none; width: 100%; max-width: 450px; padding: 15px; box-sizing: border-box;
        }

        .page { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.4s; }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { 
            background: var(--card); border-radius: 15px; padding: 20px; 
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            width: 100%; margin-bottom: 15px; box-sizing: border-box;
        }
        .val { font-size: 2.8rem; font-weight: bold; margin: 10px 0; }
        .label { font-size: 0.8rem; color: var(--dim); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Botones y Estados */
        .btn { 
            width: 100%; padding: 12px; border-radius: 30px; border: none; 
            font-weight: bold; background: #3d445a; color: white; text-transform: uppercase; 
        }
        .active-led { background: var(--green); box-shadow: 0 0 15px var(--green); }
        .active-alarm { background: var(--red); box-shadow: 0 0 10px var(--red); }

        /* Navegación Inferior */
        .nav-container { 
            display: flex; justify-content: space-between; align-items: center; 
            width: 100%; margin-top: 10px; 
        }
        .nav-arrow { 
            background: var(--card); color: var(--accent); border: 1px solid var(--accent);
            width: 45px; height: 45px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; cursor: pointer; transition: 0.3s;
        }
        .nav-arrow:hover { background: var(--accent); color: white; }

        /* Status LED */
        .status-header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .ojo-buey { width: 10px; height: 10px; background: #444; border-radius: 50%; }
        .online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="card" style="width: 280px;">
            <h3>Acceso WAN</h3>
            <input type="password" id="passInput" style="width:90%; padding:10px; margin-bottom:15px; background:#1e222d; border:1px solid #3d445a; color:white; text-align:center; border-radius:8px;" placeholder="Contraseña">
            <button class="btn active-led" onclick="checkPass()">ENTRAR</button>
        </div>
    </div>

    <div id="header-brand" class="top-bar" style="display:none;">
        <div class="brand">TELEMETRÍA<br><span>NANO</span></div>
        <div class="user-info">Usuario<br>Proyecto #1</div>
    </div>

    <div id="main-content">
        
        <div class="status-header">
            <div id="status-led" class="ojo-buey"></div>
            <span id="status-text" style="font-size: 0.7rem; color: var(--dim);">CONECTANDO...</span>
        </div>

        <div id="page1" class="page active">
            <div class="card">
                <div class="label">Potenciómetro</div>
                <div class="val"><span id="pot">--</span>%</div>
            </div>
            
            <div class="card">
                <div class="label">Estado Alarma</div>
                <div style="display: flex; justify-content: center; margin-top: 10px;">
                    <div id="alm-box" class="btn" style="max-width: 200px; cursor: default;">NORMAL</div>
                </div>
                <div style="font-size: 0.75rem; color: var(--dim); margin-top:12px;">Activaciones Totales: <span id="counter">0</span></div>
            </div>

            <div class="card">
                <div class="label">Switch Físico</div>
                <div id="sw-status" style="font-size: 1.1rem; margin-top:10px; font-weight:bold;">--</div>
            </div>
            
            <div class="nav-container">
                <div style="width:45px"></div>
                <span style="font-size:0.7rem; color:var(--dim); letter-spacing:2px;">MONITOREO</span>
                <div class="nav-arrow" onclick="changePage(2)">→</div>
            </div>
        </div>

        <div id="page2" class="page">
            <div class="card" style="padding: 40px 20px;">
                <div class="label">Control de Salida</div>
                <div style="display:flex; justify-content:center; margin: 30px 0;">
                    <button id="btn-led" class="btn" onclick="toggleLED()" style="height: 120px; width: 120px; border-radius: 50%; font-size: 0.8rem; border: 4px solid #1e222d;">APAGADO</button>
                </div>
                <p style="color: var(--dim); font-size: 0.8rem;">Toque el círculo para conmutar</p>
            </div>

            <div class="nav-container">
                <div class="nav-arrow" onclick="changePage(1)">←</div>
                <span style="font-size:0.7rem; color:var(--dim); letter-spacing:2px;">CONTROL</span>
                <div style="width:45px"></div>
            </div>
        </div>

    </div>

    <script>
        let client;
        let ledState = false;

        function checkPass() {
            if (document.getElementById('passInput').value === "Nano01") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('header-brand').style.display = 'flex';
                initMQTT();
            }
        }

        function changePage(pageNum) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + pageNum).classList.add('active');
        }

        function initMQTT() {
            const broker = 'wss://broker.hivemq.com:8884/mqtt';
            client = mqtt.connect(broker);

            client.on('connect', () => {
                document.getElementById('status-led').classList.add('online');
                document.getElementById('status-text').innerText = "VINCULADO AL BROKER";
                client.subscribe("esp32/telemetria/#");
                client.subscribe("esp32/alarmas/#");
            });

            client.on('message', (topic, message) => {
                const msg = message.toString();
                if (topic === "esp32/telemetria/pot") document.getElementById('pot').innerText = msg;
                if (topic === "esp32/alarmas/conteo") document.getElementById('counter').innerText = msg;
                if (topic === "esp32/telemetria/switch") {
                    document.getElementById('sw-status').innerText = (msg === "1") ? "CERRADO" : "ABIERTO";
                }
                if (topic === "esp32/alarmas/estado") {
                    const alm = document.getElementById('alm-box');
                    alm.innerText = (msg === "1") ? "ALERTA" : "NORMAL";
                    (msg === "1") ? alm.classList.add('active-alarm') : alm.classList.remove('active-alarm');
                }
            });
        }

        function toggleLED() {
            if (client && client.connected) {
                ledState = !ledState;
                const btn = document.getElementById('btn-led');
                client.publish("esp32/control/led", ledState ? "1" : "0");
                btn.innerText = ledState ? "ENCENDIDO" : "APAGADO";
                ledState ? btn.classList.add('active-led') : btn.classList.remove('active-led');
            }
        }

        document.getElementById('passInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPass(); });
    </script>
</body>
</html>
