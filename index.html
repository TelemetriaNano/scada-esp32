<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script>
    // IMPORTANTE: Para GitHub Pages (HTTPS) usamos el puerto 8884
    const broker = "wss://430b579b966d4e73a269ce0c803564a7.s1.eu.hivemq.cloud:8884/mqtt";
    
    const options = {
        clientId: 'Dashboard_Nano_' + Math.random().toString(16).substr(2, 8),
        username: 'Telemetria-Nano',
        password: 'Telemetria01',
        clean: true
    };

    const client = mqtt.connect(broker, options);

    client.on('connect', () => {
        console.log("¡Conectado a HiveMQ Cloud!");
        document.getElementById('status').innerText = "✅ SISTEMA ONLINE";
        document.getElementById('status').style.color = "#4CAF50";
        
        // Suscribirse a los mismos tópicos del .ino
        client.subscribe("esp32/telemetria/pot");
        client.subscribe("esp32/alarmas/estado");
        client.subscribe("esp32/alarmas/conteo");
    });

    client.on('message', (topic, message) => {
        const msg = message.toString();
        if(topic === "esp32/telemetria/pot") {
            document.getElementById('pot-val').innerText = msg + "%";
        }
        if(topic === "esp32/alarmas/estado") {
            // Si llega "1", ponemos el fondo en rojo
            document.body.style.backgroundColor = (msg === "1") ? "#441111" : "#1a1c24";
        }
        if(topic === "esp32/alarmas/conteo") {
            document.getElementById('alarm-count').innerText = msg;
        }
    });

    client.on('error', (err) => {
        console.error("Error de conexión:", err);
        document.getElementById('status').innerText = "❌ ERROR DE ENLACE";
    });

    function toggleLED() {
        // Enviamos el comando al ESP32 en Wokwi
        const val = window.ledState === "1" ? "0" : "1";
        window.ledState = val;
        client.publish("esp32/control/led", val);
    }
</script>
