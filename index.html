<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SCADA ESP32 – WAN</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

<header>
  <h2>SCADA ESP32</h2>
  <small>Telemetría WAN (solo lectura)</small>
</header>

<main>
  <div class="card" id="potCard">
    <h3>Potenciómetro</h3>
    <div class="value"><span id="pot">--</span>%</div>
  </div>

  <div class="card">
    <h3>Switch</h3>
    <div id="sw" class="badge off">OFF</div>
  </div>

  <div class="card">
    <h3>Alarma</h3>
    <div id="alarm" class="badge off">OK</div>
  </div>

  <div class="card">
    <h3>Evento</h3>
    <div id="event">--</div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
