<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCADA ESP32</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>SCADA ESP32</h1>
    <p>Telemetría WAN (solo lectura)</p>

    <div class="grid">
      <div class="card">
        <div class="title">Potenciómetro</div>
        <div class="value" id="pot">--%</div>
      </div>
      <div class="card">
        <div class="title">Switch</div>
        <div class="value btn" id="sw">OFF</div>
      </div>
      <div class="card">
        <div class="title">Alarma</div>
        <div class="value btn" id="alarm">OK</div>
      </div>
      <div class="card">
        <div class="title">Evento</div>
        <div class="value" id="event">--</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
