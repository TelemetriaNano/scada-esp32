<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCADA NANO - DASHBOARD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1c24; color: white; text-align: center; margin: 0; padding: 20px; transition: background 0.5s; }
        .status-bar { padding: 10px; margin-bottom: 20px; border-radius: 8px; background: #252936; display: inline-block; font-size: 0.9em; }
        .container { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .card { background: #252936; padding: 30px; border-radius: 20px; width: 220px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-top: 6px solid #4CAF50; }
        .val { font-size: 3.5em; font-weight: bold; color: #4CAF50; margin: 10px 0; }
        .label { color: #888; text-transform: uppercase; font-size: 0.8em; letter-spacing: 1px; }
        .btn { background: #4CAF50; color: white; border: none; padding: 15px 40px; font-size: 1.1em; border-radius: 50px; cursor: pointer; margin-top: 40px; transition: 0.3s; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3); }
        .btn:hover { background: #45a049; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .alarm-active { background: #4a1212 !important; }
    </style>
</head>
<body>

    <div class="status-bar" id="status">🟡 CONECTANDO A HIVEMQ...</div>

    <h1>SCADA NANO WAN</h1>

    <div class="container">
        <div class="card" id="card-pot">
            <div class="label">Nivel Potenciómetro</div>
            <div class="val" id="pot-val">0%</div>
        </div>

        <div class="card">
            <div class="label">Contador de Alarmas</div>
            <div class="val" id="alarm-count">0</div>
        </div>
    </div>

    <button class="btn" onclick="toggleLED()">INTERRUPTOR LED MANUAL</button>

    <script>
        // CONFIGURACIÓN OBLIGATORIA PARA GITHUB (WSS + PUERTO 8884)
        const broker = "wss://430b579b966d4e73a269ce0c803564a7.s1.eu.hivemq.cloud:8884/mqtt";
        
        const options = {
            clientId: 'Web_Dashboard_' + Math.random().toString(16).substr(2, 8),
            username: 'Telemetria-Nano',
            password: 'Telemetria01',
            clean: true
        };

        const client = mqtt.connect(broker, options);
        let ledState = 0;

        client.on('connect', () => {
            document.getElementById('status').innerText = "✅ DASHBOARD ONLINE";
            document.getElementById('status').style.color = "#4CAF50";
            
            // Suscripción a tópicos
            client.subscribe("esp32/telemetria/pot");
            client.subscribe("esp32/alarmas/estado");
            client.subscribe("esp32/alarmas/conteo");
        });

        client.on('message', (topic, message) => {
            const msg = message.toString();
            console.log("Dato:", topic, "->", msg);

            if(topic === "esp32/telemetria/pot") {
                document.getElementById('pot-val').innerText = msg + "%";
            }
            if(topic === "esp32/alarmas/estado") {
                if(msg === "1") {
                    document.body.classList.add('alarm-active');
                    document.getElementById('card-pot').style.borderTopColor = "#ff4444";
                } else {
                    document.body.classList.remove('alarm-active');
                    document.getElementById('card-pot').style.borderTopColor = "#4CAF50";
                }
            }
            if(topic === "esp32/alarmas/conteo") {
                document.getElementById('alarm-count').innerText = msg;
            }
        });

        client.on('error', (err) => {
            document.getElementById('status').innerText = "❌ ERROR DE CONEXIÓN";
            console.error(err);
        });

        function toggleLED() {
            ledState = (ledState === 0) ? 1 : 0;
            client.publish("esp32/control/led", ledState.toString());
        }
    </script>
</body>
</html>
